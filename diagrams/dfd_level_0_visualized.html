<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnrollAssess System - Level 0 DFD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .diagram-container {
            position: relative;
            width: 1200px;
            height: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 60px;
            overflow: visible;
        }

        /* Central System Process */
        .system {
            position: absolute;
            width: 280px;
            height: 280px;
            background: white;
            border: 4px solid black;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: black;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .system h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: black;
            font-weight: 700;
            line-height: 1.3;
            text-align: center;
        }

        /* External Entities */
        .entity {
            position: absolute;
            width: 180px;
            padding: 18px 20px;
            background: #f9e4b7;
            color: black;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #333;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            z-index: 50;
        }

        .entity h3 {
            font-size: 16px;
            margin-bottom: 4px;
            color: black;
            font-weight: 700;
            line-height: 1.2;
        }

        .entity p {
            font-size: 12px;
            color: #333;
            line-height: 1.3;
        }

        /* External Systems */
        .system-entity {
            position: absolute;
            width: 180px;
            padding: 18px 20px;
            background: #f9e4b7;
            color: black;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #333;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            z-index: 50;
        }

        .system-entity h3 {
            font-size: 16px;
            margin-bottom: 4px;
            color: black;
            font-weight: 700;
            line-height: 1.2;
        }

        .system-entity p {
            font-size: 12px;
            color: #333;
            line-height: 1.3;
        }

        /* Entity Positions */
        .entity-admin {
            top: 60px;
            left: 80px;
        }

        .entity-applicants {
            top: 60px;
            right: 80px;
        }

        .entity-instructors {
            top: 300px;
            right: 80px;
        }

        .entity-email {
            bottom: 80px;
            left: 80px;
        }

        .entity-database {
            bottom: 80px;
            right: 80px;
        }

        /* SVG Container for curved arrows */
        .flow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .flow-path {
            fill: none;
            stroke: #333;
            stroke-width: 2.5px;
            marker-end: url(#arrowhead);
        }

        /* Flow Labels */
        .flow-label {
            position: absolute;
            background: white;
            padding: 6px 10px;
            border: 1.5px solid #333;
            border-radius: 4px;
            font-size: 11px;
            color: #333;
            white-space: nowrap;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            z-index: 200;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <!-- SVG for curved arrows - will be populated by JavaScript -->
        <svg class="flow-svg" viewBox="0 0 1200 800">
            <defs>
                <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="11" refY="3.5" orient="auto">
                    <polygon points="0 0, 12 3.5, 0 7" fill="#333" />
                </marker>
            </defs>
        </svg>

        <!-- Central System Process -->
        <div class="system">
            <h2>EnrollAssess</h2>
            <h2>System</h2>
        </div>

        <!-- External Entities -->
        <div class="entity entity-admin">
            <h3>Admin</h3>
            <p>Dept Head</p>
        </div>

        <div class="entity entity-applicants">
            <h3>Applicants</h3>
            <p>Students</p>
        </div>

        <div class="entity entity-instructors">
            <h3>Instructors</h3>
            <p>Faculty Members</p>
        </div>

        <!-- External Systems -->
        <div class="system-entity entity-email">
            <h3>Email System</h3>
            <p>SMTP Service</p>
        </div>

        <div class="system-entity entity-database">
            <h3>Database</h3>
            <p>MySQL Storage</p>
        </div>

        <!-- Data Flow Labels - positioned by JavaScript -->
        <div id="flow-labels"></div>
    </div>

    <script>
        // Precise positioning and alignment calculations
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.diagram-container');
            const system = document.querySelector('.system');
            const svg = document.querySelector('.flow-svg');
            const flowLabelsContainer = document.getElementById('flow-labels');
            
            // Wait for layout to settle
            setTimeout(() => {
                // Get element positions relative to container
                function getElementPosition(selector) {
                    const el = document.querySelector(selector);
                    const rect = el.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    return {
                        left: rect.left - containerRect.left,
                        top: rect.top - containerRect.top,
                        right: rect.right - containerRect.left,
                        bottom: rect.bottom - containerRect.top,
                        centerX: rect.left - containerRect.left + rect.width / 2,
                        centerY: rect.top - containerRect.top + rect.height / 2,
                        width: rect.width,
                        height: rect.height
                    };
                }
                
                // Get connection point on entity
                function getEntityConnectionPoint(entityPos, side) {
                    switch(side) {
                        case 'right':
                            return { x: entityPos.right, y: entityPos.centerY };
                        case 'left':
                            return { x: entityPos.left, y: entityPos.centerY };
                        case 'top':
                            return { x: entityPos.centerX, y: entityPos.top };
                        case 'bottom':
                            return { x: entityPos.centerX, y: entityPos.bottom };
                        default:
                            return { x: entityPos.centerX, y: entityPos.centerY };
                    }
                }
                
                // Get connection point on system circle
                function getSystemConnectionPoint(angleDeg) {
                    const systemPos = getElementPosition('.system');
                    const centerX = systemPos.centerX;
                    const centerY = systemPos.centerY;
                    const radius = systemPos.width / 2;
                    const angleRad = (angleDeg * Math.PI) / 180;
                    return {
                        x: centerX + radius * Math.cos(angleRad),
                        y: centerY + radius * Math.sin(angleRad)
                    };
                }
                
                // Create smooth curve path
                function createCurvePath(start, end, curvature = 0.5) {
                    const midX = (start.x + end.x) / 2;
                    const midY = (start.y + end.y) / 2;
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const perpX = -dy / distance;
                    const perpY = dx / distance;
                    const controlX = midX + perpX * distance * curvature;
                    const controlY = midY + perpY * distance * curvature;
                    return `M ${start.x} ${start.y} Q ${controlX} ${controlY}, ${end.x} ${end.y}`;
                }
                
                // Get positions
                const adminPos = getElementPosition('.entity-admin');
                const applicantsPos = getElementPosition('.entity-applicants');
                const instructorsPos = getElementPosition('.entity-instructors');
                const emailPos = getElementPosition('.entity-email');
                const databasePos = getElementPosition('.entity-database');
                
                // Create paths
                const paths = [];
                
                // 1. Admin to System: Manage System / Gen. Codes
                const adminRight = getEntityConnectionPoint(adminPos, 'right');
                const systemTopLeft = getSystemConnectionPoint(-45);
                paths.push({
                    path: createCurvePath(adminRight, systemTopLeft, 0.3),
                    label: { text: 'Manage System / Gen. Codes', x: (adminRight.x + systemTopLeft.x) / 2, y: (adminRight.y + systemTopLeft.y) / 2 - 20 }
                });
                
                // 2. System to Admin: Reports & Analytics
                const systemBottomLeft = getSystemConnectionPoint(135);
                paths.push({
                    path: createCurvePath(systemBottomLeft, adminRight, 0.3),
                    label: { text: 'Reports & Analytics', x: (systemBottomLeft.x + adminRight.x) / 2, y: (systemBottomLeft.y + adminRight.y) / 2 + 20 }
                });
                
                // 3. Applicants to System: Enter Access Code
                const applicantsLeft = getEntityConnectionPoint(applicantsPos, 'left');
                const systemTopRight = getSystemConnectionPoint(-135);
                paths.push({
                    path: createCurvePath(applicantsLeft, systemTopRight, 0.3),
                    label: { text: 'Enter Access Code', x: (applicantsLeft.x + systemTopRight.x) / 2, y: (applicantsLeft.y + systemTopRight.y) / 2 - 20 }
                });
                
                // 4. Applicants to System: Submit Exam Answers
                const applicantsLeft2 = { x: applicantsLeft.x, y: applicantsLeft.y + 30 };
                const systemTopRight2 = getSystemConnectionPoint(-120);
                paths.push({
                    path: createCurvePath(applicantsLeft2, systemTopRight2, 0.3),
                    label: { text: 'Submit Exam Answers', x: (applicantsLeft2.x + systemTopRight2.x) / 2, y: (applicantsLeft2.y + systemTopRight2.y) / 2 - 10 }
                });
                
                // 5. System to Applicants: Exam Interface / Results
                const systemBottomRight = getSystemConnectionPoint(135);
                paths.push({
                    path: createCurvePath(systemBottomRight, applicantsLeft, 0.3),
                    label: { text: 'Exam Interface / Results', x: (systemBottomRight.x + applicantsLeft.x) / 2, y: (systemBottomRight.y + applicantsLeft.y) / 2 + 20 }
                });
                
                // 6. System to Instructors: Applicant Data / Interview Sched
                const instructorsLeft = getEntityConnectionPoint(instructorsPos, 'left');
                const systemRight = getSystemConnectionPoint(90);
                paths.push({
                    path: createCurvePath(systemRight, instructorsLeft, 0.3),
                    label: { text: 'Applicant Data / Interview Sched', x: (systemRight.x + instructorsLeft.x) / 2, y: (systemRight.y + instructorsLeft.y) / 2 + 20 }
                });
                
                // 7. Instructors to System: Interview Scores / Feedback
                paths.push({
                    path: createCurvePath(instructorsLeft, systemRight, 0.3),
                    label: { text: 'Interview Scores / Feedback', x: (instructorsLeft.x + systemRight.x) / 2, y: (instructorsLeft.y + systemRight.y) / 2 - 20 }
                });
                
                // 8. System to Email: Send Notification Request
                const emailRight = getEntityConnectionPoint(emailPos, 'right');
                const systemBottom = getSystemConnectionPoint(45);
                paths.push({
                    path: createCurvePath(systemBottom, emailRight, 0.3),
                    label: { text: 'Send Notification Request', x: (systemBottom.x + emailRight.x) / 2, y: (systemBottom.y + emailRight.y) / 2 + 20 }
                });
                
                // 9. System to Database: Store Data
                const databaseLeft = getEntityConnectionPoint(databasePos, 'left');
                const systemBottomRight2 = getSystemConnectionPoint(-45);
                paths.push({
                    path: createCurvePath(systemBottomRight2, databaseLeft, 0.3),
                    label: { text: 'Store Data', x: (systemBottomRight2.x + databaseLeft.x) / 2, y: (systemBottomRight2.y + databaseLeft.y) / 2 + 20 }
                });
                
                // 10. Database to System: Retrieve Data
                paths.push({
                    path: createCurvePath(databaseLeft, systemBottomRight2, 0.3),
                    label: { text: 'Retrieve Data', x: (databaseLeft.x + systemBottomRight2.x) / 2, y: (databaseLeft.y + systemBottomRight2.y) / 2 - 20 }
                });
                
                // Draw paths
                paths.forEach((item, index) => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('class', 'flow-path');
                    path.setAttribute('d', item.path);
                    svg.appendChild(path);
                    
                    // Create label
                    const label = document.createElement('div');
                    label.className = 'flow-label';
                    label.textContent = item.label.text;
                    label.style.left = item.label.x + 'px';
                    label.style.top = item.label.y + 'px';
                    label.style.transform = 'translate(-50%, -50%)';
                    flowLabelsContainer.appendChild(label);
                });
            }, 100);
        });
    </script>
</body>
</html>
